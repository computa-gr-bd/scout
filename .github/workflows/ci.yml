name: ScoutVision CI

on: [push, pull_request]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scout
          POSTGRES_PASSWORD: scout-test
          POSTGRES_DB: scout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scout -d scout_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint/syntax check via compileall
        run: python -m compileall -q backend/app backend/tests
      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci_scoutvision.db
          SECRET_KEY: ci-test-secret
          ENVIRONMENT: test
        run: pytest -q
      - name: Test PostgreSQL migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://scout:scout-test@127.0.0.1:5432/scout_test
          SECRET_KEY: ci-test-secret
          ENVIRONMENT: test
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade 0009
          python -c "from app.db import engine; from sqlalchemy import text; c = engine.connect(); assert c.scalar(text(\"SELECT to_regclass('public.ix_event_match_type')\")); c.close()"
          python -m alembic upgrade head

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm test
      - name: TypeScript check
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000/api
        run: npm run build
